<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
  <title id="title">Initial DriftRun placeholder logo</title>
  <desc id="desc">Temporary logo with independent white and black outline layers around INITIAL and DriftRun text.</desc>

  <!-- White outer stroke layer -->
  <g class="outline-white" fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill markers">
    <text x="220" y="118" font-family="Arial Black, Impact, sans-serif" font-size="84" font-style="italic" font-weight="900" letter-spacing="1">INITIAL</text>
    <text x="168" y="292" font-family="Arial Black, Impact, sans-serif" font-size="200" font-style="italic" font-weight="900">D</text>
    <text x="294" y="292" font-family="Arial Black, Impact, sans-serif" font-size="122" font-style="italic" font-weight="900">riftRun</text>
  </g>

  <!-- Black inner stroke layer -->
  <g class="outline-black" fill="none" stroke="#000000" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill markers">
    <text x="220" y="118" font-family="Arial Black, Impact, sans-serif" font-size="84" font-style="italic" font-weight="900" letter-spacing="1">INITIAL</text>
    <text x="168" y="292" font-family="Arial Black, Impact, sans-serif" font-size="200" font-style="italic" font-weight="900">D</text>
    <text x="294" y="292" font-family="Arial Black, Impact, sans-serif" font-size="122" font-style="italic" font-weight="900">riftRun</text>
  </g>

  <!-- Fill layer -->
  <g stroke="none">
    <text x="220" y="118" font-family="Arial Black, Impact, sans-serif" font-size="84" font-style="italic" font-weight="900" fill="#ffffff" letter-spacing="1">INITIAL</text>
    <text x="168" y="292" font-family="Arial Black, Impact, sans-serif" font-size="200" font-style="italic" font-weight="900" fill="#d71620">D</text>
    <text x="294" y="292" font-family="Arial Black, Impact, sans-serif" font-size="122" font-style="italic" font-weight="900" fill="#ffffff">riftRun</text>
  </g>

  <style>
    .outline-white text {
      stroke-width: 28;
    }

    .outline-black text {
      stroke-width: 18;
    }
  </style>
</svg>